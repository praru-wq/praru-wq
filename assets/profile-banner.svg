<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Hi, I am Prarthana Binu Kumar, a creative technologist">
<style>
@keyframes pop{0%{transform:translateY(18px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave{0%,100%{transform:rotate(0deg)}30%{transform:rotate(14deg)}60%{transform:rotate(-8deg)}}
.intro{animation:pop .8s ease-out both}.character{animation:float 4s ease-in-out infinite}.hand{transform-origin:982px 204px;animation:wave 1.8s ease-in-out infinite}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset=".48" stop-color="#3b1d72"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
  <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#f0abfc" stop-opacity=".46"/><stop offset="1" stop-color="#f0abfc" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="500" rx="34" fill="url(#bg)"/>
<circle cx="1050" cy="60" r="300" fill="url(#glow)"/><circle cx="70" cy="470" r="210" fill="url(#glow)" opacity=".48"/>
<g fill="none" stroke="#fff" stroke-opacity=".08"><path d="M0 412 Q240 330 480 408 T960 382 T1320 405"/><path d="M0 448 Q240 366 480 444 T960 418 T1320 441"/></g>
<g class="intro" font-family="Segoe UI,Arial,sans-serif">
  <text x="66" y="96" fill="#ddd6fe" font-size="20" letter-spacing="5">FINAL-YEAR BCA STUDENT</text>
  <text x="64" y="169" fill="#fff" font-size="57" font-weight="750">Prarthana Binu Kumar</text>
  <text x="67" y="218" fill="#ccfbf1" font-size="25">Creative technologist • Product thinker • Confident storyteller</text>
  <g transform="translate(66 254)">
    <rect width="126" height="38" rx="19" fill="#fff" fill-opacity=".13"/><text x="63" y="25" text-anchor="middle" fill="#fff" font-size="15">AI</text>
    <rect x="140" width="166" height="38" rx="19" fill="#fff" fill-opacity=".13"/><text x="223" y="25" text-anchor="middle" fill="#fff" font-size="15">CYBERSECURITY</text>
    <rect x="320" width="148" height="38" rx="19" fill="#fff" fill-opacity=".13"/><text x="394" y="25" text-anchor="middle" fill="#fff" font-size="15">BIG DATA</text>
  </g>
  <text x="67" y="337" fill="#e2e8f0" font-size="20">I turn student problems into clear, useful digital experiences—</text>
  <text x="67" y="370" fill="#e2e8f0" font-size="20">then pitch the idea with confidence.</text>
  <g transform="translate(66 404)"><rect width="350" height="46" rx="23" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2"/><circle cx="25" cy="23" r="7" fill="#5eead4"/><text x="47" y="30" fill="#fff" font-size="17">Building • Designing • Presenting</text></g>
</g>
