  <g transform="translate(837 324)"><path d="M0 0h235l-22 112H22z" fill="url(#screen)" stroke="#a5f3fc" stroke-opacity=".45" stroke-width="2"/><rect x="-10" y="112" width="255" height="16" rx="8" fill="#cbd5e1"/><circle cx="118" cy="57" r="18" fill="none" stroke="#a7f3d0" stroke-width="3"/><path d="M110 57l6 6 12-14" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g class="intro" font-family="Segoe UI,Arial,sans-serif">
  <path d="M772 78h260a20 20 0 0 1 20 20v70a20 20 0 0 1-20 20H902l-30 25 7-25H772a20 20 0 0 1-20-20V98a20 20 0 0 1 20-20z" fill="#fff"/>
  <text x="902" y="119" text-anchor="middle" fill="#4c1d95" font-size="22" font-weight="700">Hi! I'm Prarthana.</text>
  <text x="902" y="151" text-anchor="middle" fill="#475569" font-size="17">Let's build an idea people remember.</text>
