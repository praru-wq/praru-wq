  <path d="M946 190q14 13 29 0" fill="none" stroke="#9f4f5a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="931" cy="161" r="4" fill="#241b1d"/><circle cx="988" cy="161" r="4" fill="#241b1d"/>
  <path d="M916 206q39 32 77 0l20 31-97 1z" fill="#f4c7ad"/>
  <path d="M873 352c2-79 28-126 82-129 55-3 94 42 100 129z" fill="url(#jacket)"/>
